<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thermal Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>

<!-- AUTH SECTION -->
<div id="auth-section">
    <h1>AMG8833 Thermal Dashboard</h1>

    <div id="login-form" class="auth-box">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username"/>
        <input type="password" id="password" placeholder="Password"/>
        <button onclick="login()">Login</button>
        <p id="login-error" style="color:#f85149; display:none;"></p>
        <p>No account? <span class="auth-link" onclick="showRegister()">Register</span></p>
    </div>

    <div id="register-form" class="auth-box" style="display:none;">
        <h2>Register</h2>
        <input type="text" id="reg-username" placeholder="Username"/>
        <input type="password" id="reg-password" placeholder="Password"/>
        <button onclick="register()">Register</button>
        <p id="register-error" style="color:#f85149; display:none;"></p>
        <p>Have an account? <span class="auth-link" onclick="showLogin()">Login</span></p>
    </div>
</div>

<!-- DASHBOARD SECTION -->
<div id="dashboard-section" style="display:none;">

    <div id="top-bar">
        <h1>AMG8833 Thermal Dashboard</h1>
        <button id="logout-btn" onclick="logout()">Logout</button>
    </div>

<div id="status">Disconnected</div>

<div id="main-content">
    <div id="heatmap-container">
        <canvas id="heatmap" width="240" height="240"></canvas>

        <div id="sensor-info">
            <p>Thermistor: <span id="thermistor">--</span> °C</p>
            <p>Prediction: <span id="prediction">--</span></p>
            <p>Confidence: <span id="confidence">--</span></p>
            <p>MAC: <span id="mac-display">--</span></p>
        </div>

        <div id="controls">
            <button onclick="sendCommand('get_one')">Get One</button>
            <button id="btn-continuous" onclick="toggleContinuous()">Start Continuous</button>
            <button onclick="sendCommand('stop')">Stop</button>
        </div>
        <div id="message"></div>
    </div>

    <div id="history">
        <h2>Stored Readings</h2>
        <div id="filter-bar">
            <input type="text" id="mac-filter" placeholder="Filter by MAC"/>
            <button onclick="loadReadings()">Filter</button>
            <button onclick="clearFilter()">Clear</button>
        </div>
        <table id="readings-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>MAC</th>
                    <th>Temp (°C)</th>
                    <th>Prediction</th>
                    <th>Confidence</th>
                    <th>Time</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="readings-tbody"></tbody>
        </table>
        <p id="no-data" style="display:none;">No readings yet.</p>
    </div>
</div>

<script src="{{ url_for('static', path='script.js') }}"></script>
</body>
</html>
